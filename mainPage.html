<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Box</title>
    <link rel="stylesheet" href="mainPage.css">
    <script src="https://unpkg.com/langchain@0.0.164/dist/langchain.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 左侧智能体选择栏 -->
        <div class="sidebar">
            <div class="agent-list">
            </div>
        </div>

        <!-- 主聊天区域 -->
        <div class="main-content">
            <!-- 聊天消息区域 -->
            <div class="chat-container">
                <iframe class="chat-frame" src="about:blank" frameborder="0"></iframe>
            </div>
            <!-- 底部部门选择栏 -->
            <div class="department-bar">
                <div class="department-list"></div>
            </div>
        </div>
    </div>
    <script src="mainPage.js"></script>
</body>
</html>
