<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="chat.css">
    <!-- 引入Marked.js -->
    <script src="lib/marked.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <button class="new-chat-btn">新建会话</button>
        <div class="conversation-list"></div>
        <div class="user-section">
            <button id="login-btn" class="login-btn">登录</button>
            <div id="user-info" class="user-info" style="display: none;">
                <span id="username-display"></span>
                <span class="points-display" id="points-display"></span>
                <button id="logout-btn" class="logout-btn">退出</button>
            </div>
        </div>
    </div>
    <body style="margin: 0; padding: 0;">
        <div class="chat-container">
            <div class="chat-messages"></div>
            <div class="chat-input-container">
                <button class="upload-btn" title="上传文件" onclick="document.getElementById('file-input').click()">
                    <img src="images/icons/download.jpg" class="upload-icon" alt="上传">
                </button>
                <input type="file" id="file-input" style="display:none" onchange="handleFileUpload(event)">
                <div id="file-preview" class="file-preview"></div>
                <textarea class="message-input" placeholder="输入消息..."></textarea>
                <button class="send-btn">发送</button>
            </div>
        </div>
    </body>
    <!-- 确保 points.js 在 chat.js 之前加载 -->
    <script src="user_functions/codes/points.js"></script>
    <script src="file_functions/codes/file.js"></script>
    <script src="conversation.js"></script>
    <script src="chat.js"></script>

    <!-- Points recharge modal -->
    <div id="points-modal" class="points-modal">
        <div class="points-modal-content">
            <h2 class="points-modal-title">积分充值</h2>
            <p class="points-modal-text">
                扫描下方二维码进行积分充值。<br>
                充值完成后，请刷新页面查看最新积分。
            </p>
            <div class="points-modal-qrcode" onclick="addPoints()">
                <img alt="充值二维码">
            </div>
            <button class="points-modal-close" onclick="closePointsModal()">关闭</button>
        </div>
    </div>
</body>
</html>
