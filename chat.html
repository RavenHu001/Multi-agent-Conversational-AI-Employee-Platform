<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="chat.css">
    <!-- 引入Marked.js -->
    <script src="lib/marked.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <button class="new-chat-btn">新建会话</button>
        <div class="conversation-list"></div>
    </div>
    <body style="margin: 0; padding: 0;">
        <div class="chat-container">
            <div class="chat-messages"></div>
            <div class="chat-input-container">
                <button class="upload-btn" title="上传文件" onclick="document.getElementById('file-input').click()">
                    <img src="images/icons/download.jpg" class="upload-icon" alt="上传">
                </button>
                <input type="file" id="file-input" style="display:none" onchange="handleFileUpload(event)">
                <div id="file-preview" class="file-preview"></div>
                <textarea class="message-input" placeholder="输入消息..."></textarea>
                <button class="send-btn">发送</button>
            </div>
        </div>
    </body>
    
    <script src="chat.js"></script>
    <script src="conversation.js"></script>
    <script src="file_functions/codes/file.js"></script>
</body>
</html>
