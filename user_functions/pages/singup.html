<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 数智达AI员工团队</title>
    <link rel="stylesheet" href="user_pages.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>数智达AI员工团队</h1>
            <form id="singup-form" class="login-form">
                <div class="form-group">
                    <input type="text" name="username" id="username" placeholder="用户名" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" id="password" placeholder="密码" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password_confirm" id="password_confirm" placeholder="确认密码" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="login-btn">注册</button>
                </div>
                <div class="form-links">
                    <a href="login.html" class="forgot-password">登录账号</a>
                </div>
            </form>
        </div>
    </div>
    <script src="../codes/singup.js"></script>
</body>
</html>
